services:
  postgres:
    image: postgres:16-alpine
    container_name: smartlock-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartlock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartlock"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - smartlock-pgdata:/var/lib/postgresql/data

volumes:
  smartlock-pgdata: